<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an Issue — JanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container" style="max-width:680px;">
    <div class="page-header animate-in">
      <h1 class="page-title">Report a Civic Challenge</h1>
      <p class="page-subtitle">Describe the issue, pinpoint its location, and attach photos or videos as evidence.</p>
    </div>

    <div class="card animate-in" style="animation-delay:.1s">
      <div class="card-header">
        <span class="card-icon">📝</span>
        <h3>Challenge Details</h3>
      </div>
      <div id="alert-box"></div>
      <form id="challenge-form" class="stacked" enctype="multipart/form-data">
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required placeholder="Brief title of the issue" />
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" name="description" required placeholder="Describe the problem in detail…"></textarea>
        </div>
        <div>
          <label for="address">Address</label>
          <input type="text" id="address" name="address" required placeholder="Street, area, city" />
        </div>

        <div class="grid grid-2" style="gap:0.9rem;">
          <div>
            <label for="latitude">Latitude</label>
            <input type="number" step="any" id="latitude" name="latitude" required placeholder="e.g. 17.385" />
          </div>
          <div>
            <label for="longitude">Longitude</label>
            <input type="number" step="any" id="longitude" name="longitude" required placeholder="e.g. 78.486" />
          </div>
        </div>

        <div>
          <button type="button" class="btn secondary small" id="use-location-btn">📍 Use my current location</button>
        </div>

        <div>
          <label for="files">Photos / Videos <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="file" id="files" name="files" multiple accept="image/*,video/*" />
          <p class="help-text">Upload photos or short videos as evidence. Accepts image/video files.</p>
        </div>

        <button type="submit" class="btn" id="submit-btn" style="width:100%;margin-top:0.5rem;">Submit Challenge</button>
      </form>
    </div>
  </main>

  <footer class="site-footer"><strong>JanSetu</strong> — Civic engagement platform &copy; 2025</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/submit-challenge.js"></script>
</body>
</html>
