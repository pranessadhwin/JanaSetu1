<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Universities — JanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">
    <div class="page-header animate-in">
      <h1 class="page-title">Partner Universities</h1>
      <p class="page-subtitle">Institutions collaborating with JanSetu to resolve civic challenges.</p>
    </div>

    <div class="card animate-in" style="max-width:340px;animation-delay:.05s;padding:1rem 1.25rem;">
      <label for="discipline-filter">Filter by discipline</label>
      <select id="discipline-filter" style="margin-top:0.35rem;">
        <option value="">All disciplines</option>
      </select>
    </div>

    <div id="alert-box"></div>
    <section class="grid grid-3 animate-in" id="universities-grid" style="animation-delay:.1s"></section>
  </main>

  <footer class="site-footer"><strong>JanSetu</strong> — Civic engagement platform &copy; 2025</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/universities.js"></script>

</html>
