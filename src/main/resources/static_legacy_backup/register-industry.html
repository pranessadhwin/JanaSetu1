<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register as Industry — JanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container" style="max-width:640px;">
    <div class="page-header animate-in">
      <h1 class="page-title">Register your Organization</h1>
      <p class="page-subtitle">Mentor, fund, prototype, or deploy university-proposed solutions. A Super Admin will approve your account before login.</p>
    </div>

    <div class="card animate-in" style="animation-delay:.1s">
      <div class="card-header">
        <span class="card-icon" style="background:var(--clr-accent-light);">🏭</span>
        <h3>Organization &amp; Contact Details</h3>
      </div>
      <div id="alert-box"></div>
      <form id="register-form" class="stacked">
        <div>
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required placeholder="Your full name" />
        </div>
        <div>
          <label for="email">Login email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@company.com" />
        </div>
        <div>
          <label for="phone">Personal phone <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+91 00000 00000" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
        </div>

        <div class="divider"></div>

        <div>
          <label for="industryName">Organization name</label>
          <input type="text" id="industryName" name="industryName" required placeholder="e.g. Acme Corp" />
        </div>
        <div>
          <label for="sector">Sector <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="text" id="sector" name="sector" placeholder="e.g. Renewable Energy, FinTech, Agritech" />
        </div>
        <div>
          <label for="contactEmail">Organization contact email <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="email" id="contactEmail" name="contactEmail" placeholder="contact@company.com" />
        </div>
        <div>
          <label for="contactPhone">Organization contact phone <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="tel" id="contactPhone" name="contactPhone" placeholder="+91 00000 00000" />
        </div>

        <button type="submit" class="btn" id="register-submit" style="width:100%;margin-top:0.5rem;background:var(--clr-accent);box-shadow:0 4px 14px rgba(232,153,74,.35);">Submit for Approval</button>
      </form>
    </div>

    <p class="help-text" style="text-align:center;margin-top:1rem;">
      Already registered? <a href="login.html">Sign in</a>
    </p>
  </main>

  <footer class="site-footer"><strong>JanSetu</strong> — Civic engagement platform &copy; 2025</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register-industry.js"></script>
</body>
</html>
