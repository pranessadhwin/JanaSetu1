<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your JanSetu account to report civic issues or manage university assignments." />
  <title>Login — JanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container auth-layout">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-logo">🏛️</div>
        <h1>Welcome back</h1>
        <p>Sign in to your JanSetu account</p>
      </div>
      <div class="auth-card-body">
        <div id="alert-box"></div>
        <form id="login-form" class="stacked">
          <div>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn" id="login-submit" style="width:100%;margin-top:0.5rem;">Sign in</button>
        </form>
        <p class="help-text" style="text-align:center;margin-top:1.25rem;">
          New to JanSetu? <a href="register.html">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer"><strong>JanSetu</strong> — Civic engagement platform &copy; 2025</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
