spring.config.import=optional:file:.env[.properties]
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:mysql://localhost:3306/app_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${SERVER_PORT:8080}

jansetu4.jwt.secret=${JWT_SECRET:2f1b1cefd2b04b06b5466d55b281d45f9dd5a5f9259d49eb9f4fbf3e781a91d7}
jansetu4.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

jansetu4.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

jansetu4.ai.api-key=${API_KEY}
jansetu4.ai.model=${OPENAI_MODEL:qwen/qwen3.8-27b}
jansetu4.ai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
